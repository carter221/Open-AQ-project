name: OpenAQ Data Extraction CI

on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v4
              with:
                  python-version: '3.8'

            - name: Install dependencies
              run: |
                  python -m pip install --upgrade pip
                  pip install -r requirements.txt

            - name: Code test for API extraction with API key
              env:
                  OPENAQ_API_KEY: ${{ secrets.OPENAQ_API_KEY }}
              run: |
                  pytest tests/extract-test.py --maxfail=2 -q